
<div id="erd" style="padding: 0.5rem 0;"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});

const diagram = `erDiagram
  locations {
    serial location_id PK
    varchar location_name
  }
  interests {
    serial interest_id PK
    varchar interest_name
  }
  categories {
    serial category_id PK
    varchar category_name
  }
  users {
    serial user_id PK
    varchar username
    varchar question
    text password_hash
    text profile_image_url
    int location_id FK
    text bio
    timestamp created_at
    boolean is_active
  }
  user_interests {
    int user_id PK_FK
    int interest_id PK_FK
  }
  posts {
    serial post_id PK
    int user_id FK
    text caption
    varchar post_type
    int category_id FK
    int interest_id FK
    int location_id FK
    timestamp created_at
  }
  media {
    serial media_id PK
    int post_id FK
    text media_url
    varchar media_type
    timestamp created_at
  }
  comments {
    serial comment_id PK
    int post_id FK
    int user_id FK
    text comment_text
    timestamp created_at
  }
  likes {
    serial like_id PK
    int post_id FK
    int user_id FK
    timestamp created_at
  }
  shares {
    serial share_id PK
    int post_id FK
    int user_id FK
    timestamp shared_at
  }
  followers {
    int follower_id PK_FK
    int following_id PK_FK
    timestamp followed_at
  }

  locations ||--o{ users : "lives in"
  locations ||--o{ posts : "tagged at"
  interests ||--o{ user_interests : "tagged with"
  interests ||--o{ posts : "tagged with"
  categories ||--o{ posts : "belongs to"
  users ||--o{ user_interests : "has"
  users ||--o{ posts : "creates"
  users ||--o{ comments : "writes"
  users ||--o{ likes : "gives"
  users ||--o{ shares : "makes"
  users ||--o{ followers : "follows"
  users ||--o{ followers : "followed by"
  posts ||--o{ media : "has"
  posts ||--o{ comments : "receives"
  posts ||--o{ likes : "receives"
  posts ||--o{ shares : "receives"
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
